<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starscape UI v3 · v0.2 preview</title>
    <!-- Preload the splash star so it paints without a flash. -->
    <link rel="preload" as="image" href="/Starscape-Star.png" />
    <!-- Apply the stored theme + motion preference before first paint, so the
         app underneath the splash paints in the right theme (no light-mode
         flash) and the splash starts calm under reduced motion. Mirrors
         useTheme/useMotion storage keys; the hooks reconcile once React mounts.
         `system`/unset is left off so the prefers-color-scheme tokens apply. -->
    <script>
      try {
        var t = localStorage.getItem('starscape-theme');
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t);
        var m = localStorage.getItem('starscape-motion');
        if (m === 'reduce' || m === 'full')
          document.documentElement.setAttribute('data-motion', m);
      } catch (e) {}
    </script>
    <!-- Critical CSS for the boot splash — must be inline because the package
         stylesheet (@starlove/ui/components/loader) only arrives with the JS
         bundle, which is too late for first paint. Keep in sync with
         packages/css/src/components/loader.css. -->
    <style>
      .loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        overflow: hidden;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        transition: opacity 0.4s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
      }
      .loader::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        background-image: radial-gradient(
          circle,
          rgba(168, 192, 255, 0.15) 1px,
          transparent 1px
        );
        background-size: 50px 50px;
        will-change: transform;
        animation: loader-drift 20s linear infinite;
      }
      .loader.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      .loader__logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
        transform-origin: center;
        /* translateZ in the keyframes + backface-visibility keep the star on a
           stable GPU layer, so it doesn't snap ~1px as the grow starts. Keep in
           sync with packages/css/src/components/loader.css. */
        backface-visibility: hidden;
        will-change: transform;
        animation:
          loader-grow 0.6s cubic-bezier(0.22, 1, 0.36, 1) both,
          loader-breathe 3s ease-in-out 0.6s infinite;
      }
      .loader__label {
        margin: 0;
        color: #fff;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      @keyframes loader-drift {
        from { transform: translate(0, 0); }
        to   { transform: translate(-50px, -50px); }
      }
      @keyframes loader-grow {
        from { transform: scale(0) translateZ(0); opacity: 0; }
        to   { transform: scale(1) translateZ(0); opacity: 1; }
      }
      @keyframes loader-breathe {
        0%, 100% { transform: scale(1) translateZ(0); }
        50%      { transform: scale(1.06) translateZ(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        :root:not([data-motion='full']) .loader::before {
          animation: none;
        }
        :root:not([data-motion='full']) .loader__logo {
          animation: loader-breathe 3s ease-in-out infinite;
        }
      }
      [data-motion='reduce'] .loader::before {
        animation: none;
      }
      [data-motion='reduce'] .loader__logo {
        animation: loader-breathe 3s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <!-- Boot splash — shown immediately, removed once React mounts (see main.tsx). -->
    <div id="loader" class="loader" role="status" aria-live="polite">
      <img
        class="loader__logo"
        src="/Starscape-Star.png"
        alt="Starscape UI"
        width="120"
        height="120"
      />
      <p class="loader__label">Loading Starscape UI…</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
